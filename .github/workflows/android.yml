name: Android reader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: sdkmanager --install "ndk;27.0.12077973"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build:android
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
