name: Release desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen

      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --bundles nsis,msi

      - name: Package portable zip
        shell: pwsh
        run: ./scripts/package-portable.ps1

      - name: Write checksums
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "portable/*.zip"
          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          $files += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "checksums.txt" -Encoding utf8
          Get-Content "checksums.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: vibebook-desktop-${{ github.ref_name }}
          path: |
            portable/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            checksums.txt

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Vibebook ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            portable/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            checksums.txt
