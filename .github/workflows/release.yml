name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --bundles nsis,msi
      - name: Package portable zip
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Checksums
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "portable/*.zip"
          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          $files += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "checksums-windows.txt" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            portable/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            checksums-windows.txt

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 ffmpeg
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --bundles appimage,deb
      - name: Checksums
        shell: bash
        run: |
          for f in src-tauri/target/release/bundle/appimage/*.AppImage \
                   src-tauri/target/release/bundle/deb/*.deb; do
            sha256sum "$f" | sed 's#  .*/#  #'
          done > checksums-linux.txt
          cat checksums-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            checksums-linux.txt

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --target aarch64-apple-darwin --bundles dmg
      - name: Checksums
        shell: bash
        run: |
          for f in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            shasum -a 256 "$f" | sed 's#  .*/#  #'
          done > checksums-macos-arm64.txt
          cat checksums-macos-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            checksums-macos-arm64.txt

  macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --target x86_64-apple-darwin --bundles dmg
      - name: Checksums
        shell: bash
        run: |
          for f in src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            shasum -a 256 "$f" | sed 's#  .*/#  #'
          done > checksums-macos-x64.txt
          cat checksums-macos-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            checksums-macos-x64.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: find artifacts -maxdepth 4 -type f -print
      - uses: softprops/action-gh-release@v2
        with:
          name: Vibebook ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body: |
            ## Vibebook ${{ github.ref_name }}

            Lector EPUB local-first con conversión a audiolibro, sincronía karaoke,
            ambientación open source e identidad Verdín.

            ### Requisitos

            - **Windows 10/11 x64:** WebView2 (incluido en Windows 11). Sin firma:
              SmartScreen puede advertir.
            - **Linux x64:** WebKitGTK 4.1, GTK3 y FUSE 2 para AppImage.
            - **macOS:** `.dmg` unsigned; Gatekeeper requiere clic derecho → Abrir
              o `xattr -dr com.apple.quarantine /Applications/Vibebook.app`.
            - **Android:** MVP lector-only; el APK todavía no se incluye en esta
              release hasta validarlo en CI y en un dispositivo.

            ### Artefactos

            - ZIP portable, NSIS y MSI para Windows.
            - AppImage y `.deb` para Linux.
            - DMG arm64 y x64 para macOS.
            - `checksums-*.txt` por plataforma.

            La biblioteca, la lectura y la conversión funcionan offline. No hay
            cuenta, telemetría ni servicio pago obligatorio. Ver
            `docs/desktop.md` y `docs/ambience.md`.

            Verificá cada archivo con el `checksums-*.txt` de su plataforma
            antes de instalarlo.
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/checksums-*.txt
          fail_on_unmatched_files: true
