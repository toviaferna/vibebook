name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --bundles nsis,msi
      - name: Package portable zip
        shell: pwsh
        run: ./scripts/package-portable.ps1
      - name: Checksums
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "portable/*.zip"
          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          $files += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi"
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content "checksums-windows.txt" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            portable/*.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            checksums-windows.txt

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libfuse2 ffmpeg
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --bundles appimage,deb
      - name: Checksums
        shell: bash
        run: |
          for f in src-tauri/target/release/bundle/appimage/*.AppImage \
                   src-tauri/target/release/bundle/deb/*.deb; do
            sha256sum "$f" | sed 's#  .*/#  #'
          done > checksums-linux.txt
          cat checksums-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            checksums-linux.txt

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --target aarch64-apple-darwin --bundles dmg
      - name: Checksums
        shell: bash
        run: |
          for f in src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg; do
            shasum -a 256 "$f" | sed 's#  .*/#  #'
          done > checksums-macos-arm64.txt
          cat checksums-macos-arm64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          if-no-files-found: error
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            checksums-macos-arm64.txt

  macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: brew install ffmpeg
      - run: npm ci
      - run: npm ci --prefix web
      - run: uv sync --frozen
      - run: npm --prefix web run build
      - run: uv run pyinstaller packaging/pyinstaller/vibebook-sidecar.spec --noconfirm
      - run: npm run desktop:build -- --target x86_64-apple-darwin --bundles dmg
      - name: Checksums
        shell: bash
        run: |
          for f in src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg; do
            shasum -a 256 "$f" | sed 's#  .*/#  #'
          done > checksums-macos-x64.txt
          cat checksums-macos-x64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            checksums-macos-x64.txt

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: find artifacts -maxdepth 4 -type f -print
      - uses: softprops/action-gh-release@v2
        with:
          name: Vibebook ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          body: |
            ## Vibebook ${{ github.ref_name }}

            Lector EPUB local-first con conversión a audiolibro, karaoke,
            ambientación y proveedores TTS configurables.

            ### Novedades

            - **Proveedores TTS configurables:** Gemini, ElevenLabs y Azure
              desde Ajustes, con claves guardadas localmente y prueba de
              conexión. La API nunca devuelve la clave completa.
            - **Gemini 3.8 Flash TTS:** estilos de emoción mediante
              `speech_metadata.style`, WAV 24 kHz y timings estimados.
            - **ElevenLabs:** timings exactos por carácter y etiquetas
              `[sad]`/`[whispers]` con `eleven_v3`. Las voces gratuitas son
              en inglés; las voces españolas de biblioteca requieren plan pago.
            - **Kokoro local:** motor CPU opcional con descarga verificada del
              modelo de 354 MB y funcionamiento sin red después de instalarlo.
            - **Idioma real:** si un EPUB declara `en` pero el texto es
              español, la app detecta `es` y avisa cuando la voz elegida no
              coincide con el idioma.
            - **Ambientación:** cama o música por capítulo, ganancia, mezcla
              global, importación de audio y exportación M4B ambientado.
            - **Lector 2K:** el libro abierto aprovecha el ancho disponible y
              mantiene la navegación sobre el reproductor en 720p/768p.
            - **Karaoke:** la palabra activa se resalta en ambas páginas del
              pliego y los timings estimados de Piper ya no lo desactivan.
            - **Portadas:** generación editorial determinista para libros sin
              arte y búsqueda en Open Library/Google Books.
            - **EPUB de prueba:** fixture editorial con portada, índice, cinco
              capítulos, diálogos, metadatos e ilustración interna.
            - **Git:** `.gitattributes`, `.editorconfig`, preflight y guía de
              integración sin force push.
            - **Android:** objetivo eliminado; la app es de escritorio.

            ### Requisitos

            - **Windows 10/11 x64:** WebView2. Sin firma: SmartScreen puede
              advertir.
            - **Linux x64:** WebKitGTK 4.1, GTK3 y FUSE 2 para AppImage.
            - **macOS:** `.dmg` unsigned; Gatekeeper requiere clic derecho →
              Abrir o `xattr -dr com.apple.quarantine /Applications/Vibebook.app`.

            ### Artefactos

            - ZIP portable, NSIS y MSI para Windows.
            - AppImage y `.deb` para Linux.
            - DMG arm64 y x64 para macOS.
            - `checksums-*.txt` por plataforma.

            ### Limitaciones conocidas

            - Las claves de proveedores se guardan en un archivo local; todavía
              no se usa el Credential Manager del sistema.
            - ElevenLabs free no ofrece voces españolas nativas por API.
            - Gemini free tier limita a 3 solicitudes por minuto.
            - Kokoro descarga 354 MB la primera vez.
            - La biblioteca, la lectura y los motores locales funcionan offline.

            Verificá cada archivo con el `checksums-*.txt` de su plataforma
            antes de instalarlo.
          files: |
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.dmg
            artifacts/**/checksums-*.txt
          fail_on_unmatched_files: true
