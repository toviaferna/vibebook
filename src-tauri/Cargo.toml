[package]
name = "vibebook-desktop"
version = "0.6.0"
description = "Vibebook desktop shell"
edition = "2021"
rust-version = "1.77.2"
license = "AGPL-3.0-only"

[lib]
name = "vibebook_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
