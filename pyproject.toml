[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiol"
version = "0.1.0"
description = "Generador de audiolibros en español latinoamericano"
requires-python = ">=3.10"
dependencies = [
  "ebooklib>=0.18,<0.19",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "edge-tts>=7.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
audiol = "audiol.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
