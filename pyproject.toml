[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibebook"
version = "0.1.0"
description = "Generador de audiolibros en español latinoamericano"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ebooklib>=0.18,<0.19",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "edge-tts>=7.0",
  "requests>=2.31",
  "static-ffmpeg>=3.0",
]

[project.scripts]
vibebook = "audiol.cli:main"
audiol = "audiol.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.10",
  "pre-commit>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=audiol --cov-report=term-missing"

[tool.coverage.run]
source = ["audiol"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["audiol"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
