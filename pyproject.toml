[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibebook"
version = "0.4.1"
description = "Generador de audiolibros en español latinoamericano"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "ebooklib>=0.18,<0.19",
  "beautifulsoup4>=4.12",
  "fastapi>=0.115",
  "lxml>=5.0",
  "edge-tts>=7.0",
  "mutagen>=1.47",
  "platformdirs>=4.2",
  "python-multipart>=0.0.9",
  "requests>=2.31",
  "static-ffmpeg>=3.0",
  "uvicorn[standard]>=0.30",
  "pillow>=10",
]

[project.scripts]
vibebook = "audiol.cli:main"
audiol = "audiol.cli:main"
vibebook-sidecar = "audiol.studio.sidecar:main"

[project.optional-dependencies]
azure-sdk = [
    "azure-cognitiveservices-speech>=1.40",
]

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.10",
  "pre-commit>=4.0",
  "pyinstaller>=6.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=audiol --cov-report=term-missing"

[tool.coverage.run]
source = ["audiol"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["audiol"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
